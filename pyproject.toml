[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroterrarium"
version = "0.1.0"
description = "A connectome-constrained neural behavior sandbox"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.17.1", "pandas==3.0.5", "pyarrow==25.0.1", "brian2==2.9.0", "numba==0.67.0", "psutil==7.2.2", "requests==2.34.2", "fastapi==0.141.1", "uvicorn==0.52.4", "safetensors==0.8.0", "torch==2.14.0"]

[project.scripts]
neuroterrarium = "neuroterrarium.cli:main"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuroterrarium = ["static/**/*", "static/*"]

[tool.setuptools.data-files]
"share/neuroterrarium/configs" = ["configs/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
